name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build client bundle
        run: npm run build

      - name: Verify committed client.js is up to date
        run: |
          if ! git diff --quiet -- client.js; then
            echo "::error::client.js is stale — run 'npm run build' and commit the result"
            git diff --stat -- client.js
            exit 1
          fi

      - name: Check package contents
        run: npm pack --dry-run
